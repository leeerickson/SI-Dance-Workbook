name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: choreography-workbook-windows
          path: dist/*.exe
      # Publish a release with a public download link: named after the tag when one was
      # pushed (for example v0.1.0), otherwise after the version in package.json plus the run number.
      - id: ver
        shell: bash
        run: echo "tag=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}" >> "$GITHUB_OUTPUT"; echo "pkg=v$(node -p "require('./package.json').version")-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag || steps.ver.outputs.pkg }}
          target_commitish: ${{ github.sha }}
          name: Choreography Workbook ${{ steps.ver.outputs.tag || steps.ver.outputs.pkg }} for Windows
          prerelease: true
          files: dist/*.exe
          body: |
            **Download one of the files below:**

            - **Choreography-Workbook-Setup-…exe**: installs the app with a Start menu and desktop shortcut, and makes double-clicking a .dance file open it.
            - **Choreography-Workbook-Portable-…exe**: runs without installing.

            Windows will say "Windows protected your PC" because the app isn't code-signed yet. Click **More info**, then **Run anyway**.
